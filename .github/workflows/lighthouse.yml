name: SEO quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pinned audit tools
        run: npm ci

      - name: Validate SEO structure
        run: npm run validate

      - name: Run Lighthouse quality gates
        run: npm run audit

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/*.json
          if-no-files-found: ignore
